<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리만의 커플 공간 💕</title>
    <!-- 구글 폰트: 나눔고딕(Nanum Gothic) 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nanum Gothic', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ffd1dc, #ff9aa2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background-color: #fff0f3;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 20px 15px 20px;
            position: relative;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            z-index: 1;
            pointer-events: none;
        }
        .container > * {
            z-index: 2;
        }

        /* 상단 영역 */
        .header {
            text-align: center;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
            flex-shrink: 0;
        }

        /* [디데이 편집] 버튼 스타일 (우측 상단 배치) */
        .edit-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ffb3c1;
            color: #ff3366;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Nanum Gothic', sans-serif;
        }
        .edit-toggle-btn:hover {
            background: #ff3366;
            color: white;
        }

        /* 메인 디데이 박스 */
        .dday-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 18px;
            border-radius: 35px;
            border: 2.5px solid #ff85a1;
            box-shadow: 0 6px 18px rgba(255, 133, 161, 0.35);
            flex-shrink: 0;
        }
        .dday-text {
            color: #ff2a5f;
            font-size: 15px;
            font-weight: 800;
        }

        /* 서브 디데이 뷰 (메인 화면 배지) */
        .sub-dday-view-wrapper {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 28px;
        }
        .sub-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 10px;
            border-radius: 15px;
            border: 1px solid #ffccd5;
            font-size: 11px;
            font-weight: 700;
            color: #ff3366;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: none;
        }

        /* 팝업 편집 모달 창 스타일 */
        .edit-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 243, 0.95);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffb3c1;
            padding-bottom: 10px;
        }
        .modal-header h2 {
            color: #ff3366;
            font-size: 16px;
            font-weight: 800;
        }
        .modal-close-btn {
            background: #ff3366;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-section-title {
            font-size: 12px;
            font-weight: 800;
            color: #ff477e;
            margin-bottom: 4px;
        }
        .modal-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid #ffe5ec;
            gap: 8px;
            display: none;
        }
        
        .dday-icon-input {
            border: 1px solid #ffd1dc;
            background: #fff0f3;
            font-size: 14px;
            outline: none;
            border-radius: 8px;
            width: 38px;
            height: 32px;
            text-align: center;
            font-family: 'Nanum Gothic', sans-serif;
        }

        .modal-date-input {
            border: none;
            background: rgba(255, 240, 243, 0.9);
            font-size: 11px;
            color: #ff3366;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            padding: 4px 6px;
            border-radius: 8px;
            font-family: 'Nanum Gothic', sans-serif;
            flex: 1;
            text-align: center;
        }
        .modal-delete-btn {
            background: none;
            border: none;
            color: #ccc;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }
        .modal-delete-btn:hover {
            color: #ff3366;
        }
        .modal-add-btn {
            background: #ffffff;
            color: #ff3366;
            border: 1.5px dashed #ff85a1;
            border-radius: 12px;
            padding: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            font-family: 'Nanum Gothic', sans-serif;
        }
        .modal-add-btn:hover {
            background: #fff0f3;
        }

        /* 커플 사진 및 이름 등록 영역 */
        .photo-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: auto;
            margin-bottom: auto;
            width: 100%;
            flex-shrink: 0;
        }

        .couple-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 130px;
        }

        .photo-box {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            border: 4px solid #ff85a1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(255, 133, 161, 0.25);
            transition: transform 0.2s;
        }
        .photo-box:hover {
            transform: scale(1.05);
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }
        .photo-box span {
            color: #ff5c8a;
            font-size: 12px;
            text-align: center;
            padding: 5px;
            font-weight: 700;
            line-height: 1.3;
        }

        /* 가운데 빛나는 하트 스타일 (터치 반응 최적화) */
        .heart-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 55px;
            height: 55px;
            flex-shrink: 0;
            margin-bottom: 30px;
            -webkit-tap-highlight-color: transparent;
        }
        .heart-icon {
            font-size: 34px;
            filter: drop-shadow(0 4px 8px rgba(255, 51, 102, 0.3));
            animation: heartbeat 1.2s infinite ease-in-out;
            user-select: none;
            pointer-events: none;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .floating-heart {
            position: absolute;
            font-size: 18px;
            pointer-events: none;
            animation: floatUp 0.9s forwards ease-out;
            z-index: 99;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(0, 0) scale(0.6); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); }
        }

        /* 이름 입력 영역 박스 */
        .name-edit-area {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 6px 10px;
            width: 100%;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }
        .name-edit-area:focus-within {
            background: #ffffff;
            border: 2px solid #ff85a1;
        }

        .name-input {
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 700;
            color: #ff3366;
            text-align: center;
            width: 100%;
            outline: none;
            font-family: 'Nanum Gothic', sans-serif;
        }

        /* 배경 등록 버튼 */
        .content-bottom {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 8px;
            width: 100%;
            flex-shrink: 0;
        }

        .bg-edit-btn {
            background-color: rgba(255, 255, 255, 0.9);
            color: #ff3366;
            border: 2px solid #ffb3c1;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(255, 179, 193, 0.3);
            font-family: 'Nanum Gothic', sans-serif;
        }
        .bg-edit-btn:hover {
            background-color: #ff3366;
            color: white;
            border-color: #ff3366;
        }

        /* 하단 고정 네비게이션 바 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-top: 1px solid #ffe5ec;
            padding: 10px 0 8px 0;
            width: calc(100% + 40px);
            margin-left: -20px;
            margin-right: -20px;
            margin-bottom: -15px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            color: #b0b0b0;
            font-size: 10px;
            font-weight: 700;
            gap: 4px;
            flex: 1;
            transition: color 0.2s;
            font-family: 'Nanum Gothic', sans-serif;
        }
        .nav-item.active, .nav-item:hover {
            color: #ff3366;
        }
        .nav-icon {
            font-size: 20px;
        }
        .nav-item.center-btn .center-circle {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff4d6d, #ff758f);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.4);
            margin-top: -8px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="overlay"></div>

        <!-- 상단 디데이 영역 -->
        <div class="header">
            <!-- [디데이 편집] 버튼 -->
            <button class="edit-toggle-btn" onclick="openEditModal()">디데이 편집</button>

            <!-- 메인 디데이 박스 -->
            <div class="dday-box">
                <span class="dday-text" id="ddayDisplay">❤️ D+1일째 사랑 중</span>
            </div>

            <!-- 메인 화면에 심플하게 나타나는 서브 디데이 배지들 -->
            <div class="sub-dday-view-wrapper" id="subDdayViewWrapper">
                <span class="sub-badge" id="badge1">❤️ D+1일</span>
                <span class="sub-badge" id="badge2">✈️ D+1일</span>
                <span class="sub-badge" id="badge3">💍 D+1일</span>
            </div>
        </div>

        <!-- [디데이 편집] 모달창 -->
        <div class="edit-modal" id="editModal">
            <div class="modal-header">
                <h2>디데이 편집하기</h2>
                <button class="modal-close-btn" onclick="closeEditModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-section-title">메인 디데이 설정</div>
                <div class="modal-row" style="display: flex;">
                    <span style="font-size: 13px; font-weight: 700; color: #ff3366;">❤️ 시작일</span>
                    <input type="date" id="startDate" class="modal-date-input" onchange="calculateMainDday()">
                </div>

                <div class="modal-section-title" style="margin-top: 10px;">서브 디데이 설정 (최대 3개)</div>
                <div class="modal-row" id="modalRow1">
                    <input type="text" class="dday-icon-input" id="iconInput1" value="❤️" maxlength="2" oninput="updateView()">
                    <input type="date" id="subDate1" class="modal-date-input" onchange="updateView()">
                    <button class="modal-delete-btn" onclick="removeSubDday(1)">×</button>
                </div>
                <div class="modal-row" id="modalRow2">
                    <input type="text" class="dday-icon-input" id="iconInput2" value="✈️" maxlength="2" oninput="updateView()">
                    <input type="date" id="subDate2" class="modal-date-input" onchange="updateView()">
                    <button class="modal-delete-btn" onclick="removeSubDday(2)">×</button>
                </div>
                <div class="modal-row" id="modalRow3">
                    <input type="text" class="dday-icon-input" id="iconInput3" value="💍" maxlength="2" oninput="updateView()">
                    <input type="date" id="subDate3" class="modal-date-input" onchange="updateView()">
                    <button class="modal-delete-btn" onclick="removeSubDday(3)">×</button>
                </div>

                <button class="modal-add-btn" id="modalAddBtn" onclick="addSubDday()">+ 디데이 추가하기</button>
            </div>
        </div>

        <!-- 커플 사진 및 이름 등록 영역 -->
        <div class="photo-section">
            <div class="couple-profile">
                <div class="photo-box" onclick="document.getElementById('file1').click()">
                    <span id="text1">사진<br>등록하기</span>
                    <img id="img1" src="" alt="프로필 사진 1">
                    <input type="file" id="file1" style="display:none;" accept="image/*" onchange="previewImage(event, 'img1', 'text1')">
                </div>
                <div class="name-edit-area">
                    <input type="text" id="nameInput1" class="name-input" value="은율이" onclick="this.select()">
                </div>
            </div>
            
            <!-- 가운데 빛나는 하트 (터치 이벤트 명시적 바인딩) -->
            <div class="heart-container" id="heartContainer" onclick="burstHearts(event)" ontouchstart="burstHearts(event)">
                <div class="heart-icon">💖</div>
            </div>

            <div class="couple-profile">
                <div class="photo-box" onclick="document.getElementById('file2').click()">
                    <span id="text2">사진<br>등록하기</span>
                    <img id="img2" src="" alt="프로필 사진 2">
                    <input type="file" id="file2" style="display:none;" accept="image/*" onchange="previewImage(event, 'img2', 'text2')">
                </div>
                <div class="name-edit-area">
                    <input type="text" id="nameInput2" class="name-input" value="현이" onclick="this.select()">
                </div>
            </div>
        </div>

        <!-- 배경 등록 버튼 -->
        <div class="content-bottom">
            <button class="bg-edit-btn" onclick="document.getElementById('bgFile').click()">
                배경 등록하기
            </button>
            <input type="file" id="bgFile" style="display:none;" accept="image/*" onchange="changeBackground(event)">
        </div>

        <!-- 하단 고정 네비게이션 바 -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="alert('홈 화면입니다!')">
                <span class="nav-icon">🏠</span>
                <span>홈</span>
            </button>
            <button class="nav-item" onclick="alert('커플 앨범 화면으로 이동합니다!')">
                <span class="nav-icon">🖼️</span>
                <span>앨범</span>
            </button>
            <button class="nav-item center-btn" onclick="alert('새로운 추억 글쓰기!')">
                <div class="center-circle">＋</div>
                <span>작성</span>
            </button>
            <button class="nav-item" onclick="alert('둘만의 이야기(채팅)')">
                <span class="nav-icon">💬</span>
                <span>채팅</span>
            </button>
            <button class="nav-item" onclick="alert('설정 및 메뉴')">
                <span class="nav-icon">☰</span>
                <span>더보기</span>
            </button>
        </nav>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const todayStr = new Date().toISOString().split('T')[0];
            const mainDate = document.getElementById('startDate');
            if (mainDate) {
                mainDate.value = todayStr;
                calculateMainDday();
            }
        });

        function openEditModal() {
            document.getElementById('editModal').style.display = 'flex';
        }
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function addSubDday() {
            for (let i = 1; i <= 3; i++) {
                const row = document.getElementById(`modalRow${i}`);
                if (row.style.display !== 'flex') {
                    row.style.display = 'flex';
                    const todayStr = new Date().toISOString().split('T')[0];
                    document.getElementById(`subDate${i}`).value = todayStr;
                    break;
                }
            }
            updateView();
            checkModalAddButton();
        }

        function removeSubDday(index) {
            document.getElementById(`modalRow${index}`).style.display = 'none';
            document.getElementById(`subDate${index}`).value = '';
            updateView();
            checkModalAddButton();
        }

        function checkModalAddButton() {
            let visibleCount = 0;
            for (let i = 1; i <= 3; i++) {
                if (document.getElementById(`modalRow${i}`).style.display === 'flex') {
                    visibleCount++;
                }
            }
            const addBtn = document.getElementById('modalAddBtn');
            if (visibleCount >= 3) {
                addBtn.style.display = 'none';
            } else {
                addBtn.style.display = 'block';
            }
        }

        function updateView() {
            for (let i = 1; i <= 3; i++) {
                const row = document.getElementById(`modalRow${i}`);
                const badge = document.getElementById(`badge${i}`);
                
                if (row.style.display === 'flex') {
                    const icon = document.getElementById(`iconInput${i}`).value || '❤️';
                    const dateVal = document.getElementById(`subDate${i}`).value;
                    
                    if (dateVal) {
                        const target = new Date(dateVal);
                        const today = new Date();
                        target.setHours(0,0,0,0);
                        today.setHours(0,0,0,0);
                        const diffDays = Math.floor((today - target) / (1000 * 60 * 60 * 24));
                        
                        let text = diffDays >= 0 ? `D+${diffDays + 1}` : `D${diffDays}`;
                        badge.innerHTML = `${icon} ${text}`;
                        badge.style.display = 'inline-flex';
                    } else {
                        badge.style.display = 'none';
                    }
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        function calculateMainDday() {
            const startDateInput = document.getElementById('startDate').value;
            if (!startDateInput) return;

            const start = new Date(startDateInput);
            const today = new Date();
            start.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);

            const diffTime = today - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

            const ddayDisplay = document.getElementById('ddayDisplay');
            if (!isNaN(diffDays)) {
                if (diffDays > 0) {
                    ddayDisplay.innerHTML = `❤️ D+${diffDays}일째 사랑 중`;
                } else if (diffDays === 0) {
                    ddayDisplay.innerHTML = `❤️ 오늘이 시작일이에요! (D-Day)`;
                } else {
                    ddayDisplay.innerHTML = `❤️ 앞으로 만날 날 (D${diffDays})`;
                }
            }
        }

        // 하트 터치/클릭 시 애니메이션 생성 함수 (웹뷰 최적화 적용)
        function burstHearts(event) {
            // 기본 이벤트 중복 실행 방지
            if (event.type === 'touchstart') {
                event.preventDefault();
            }
            
            const container = document.getElementById('heartContainer');
            
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = ['💖', '✨', '💗', '💓'][Math.floor(Math.random() * 4)];
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 50;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 25;
                
                heart.style.setProperty('--dx', `${dx}px`);
                heart.style.setProperty('--dy', `${dy}px`);
                
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 900);
            }
        }

        function previewImage(event, imgId, textId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e){
                    const output = document.getElementById(imgId);
                    output.src = e.target.result;
                    output.style.display = 'block';
                    document.getElementById(textId).style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        function changeBackground(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e){
                    const container = document.getElementById('mainContainer');
                    container.style.backgroundImage = `url('${e.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        }
    </script>

</body>
</html>
